  root:'AI는 정답이 아니라, 내가 얼마나 좁은 질문만 던지며 살아왔는지를 비추는 거울이었다. 분별력이 분별심이 되고 분리의식이 되는 찰나를 알아차리는 것이 이 책의 출발점이다.',
  qs:['오늘 하루 당연하다고 생각했던 것 다섯 가지는 무엇인가요? 각각 왜 당연하다고 믿나요?','그 생각은 내 경험에서 왔나요, 사회가 가르쳐 준 것인가요?','나는 지금 사실을 보고 있나요, 나만의 해석을 보고 있나요?'],
  lab:'오늘 당연하다고 생각한 것 다섯 가지를 적고, 각각 “왜 나는 이것을 당연하다고 믿는가?”를 묻는다.',go:'debug'},
 {id:'1',part:1,label:'1장',title:'우리가 보고 있는 것은 현실일까, 해석일까?',quote:'우리는 세상을 있는 그대로 보는 것이 아니라, 우리가 이해할 수 있는 방식으로 바라본다.',
  root:'세상을 바꾸기 전에 먼저 이해할 것은 세상을 바라보는 나의 사고 메커니즘이다. 인식은 감각수용→감각전달→지각→인지적 처리→반응과 피드백으로 도는 순환이다.',
  qs:['최근 의견이 크게 부딪힌 일에서, 나는 상대가 “틀렸다”고 생각했나요, “다른 렌즈로 보고 있다”고 생각했나요?','매일 접하는 뉴스에서 나는 사실을 보나요, 믿고 싶은 해석만 모으나요?','나는 문제의 진짜 뿌리를 보고 있나요, 결과와 증상만 보고 있나요?'],
  lab:'오늘 시각 차이로 불편했던 상황 하나를 떠올려, 나는 상대를 이해하려 했는지 내 프레임으로 이기려 했는지 솔직히 적어 본다.',go:'map:personal',issue:'갈등과 혐오'},
 {id:'2',part:1,label:'2장',title:'인간의 사고는 왜 쉽게 변하지 않는가 (4개의 벽)',quote:'사람은 새로운 생각을 거부하는 존재가 아니다. 자신의 세계가 무너지는 것을 두려워하는 존재이다.',
  root:'인지적 효율성, 확증편향, 손실 회피, 사회적 동조라는 네 개의 벽은 습관에서 문화, 제도로 이어진다. 변화는 뇌의 작동을 인정하고 좋은 선택이 기본값이 되게 설계하는 데서 시작된다.',
  qs:['“원래 다 이렇게 해”라며 의심 없이 따르는 관행은 무엇인가요?','내 의견과 반대되는 정보나 사람을 만났을 때 귀담아들었나요, 무시했나요?','우리 조직에서 더 좋은 선택이 저절로 이루어지게 바꿀 수 있는 기본값은 무엇인가요?'],
  lab:'고민 하나를 골라 “왜 그런 일이 생기는가?”를 연속해서 다섯 번 물어 본다.',go:'debug'},
 {id:'3',part:1,label:'3장',title:'개념은 어떻게 현실을 가리는가',quote:'사람은 사물을 이해하기 위해 이름을 붙인다. 그러나 이름은 이해를 돕는 동시에 본질을 가리는 틀이 되기도 한다.',
  root:'이름은 이해의 시작일 뿐 본질이 아니다. 문제를 어떻게 이름 붙이느냐가 우리가 상상할 수 있는 해법의 범위를 먼저 정한다. 예: ‘저출산’이라 부르면 출산장려금, ‘삶의 불안정성’이라 부르면 전혀 다른 해법이 보인다.',
  qs:['오늘 누군가를 판단할 때 고유한 결을 보았나요, 직업·나이·이념이라는 이름표로 지레짐작했나요?','우리 조직이나 가정에서 문제 이름을 너무 단순하게 붙여 상류를 놓치고 있는 것은 무엇인가요?','‘학생’, ‘직원’, ‘어르신’이라는 단어 너머의 가능성을 살리려면 어떤 질문이 필요할까요?'],
  lab:'오늘 나/우리/그들/경쟁/협력/원래/절대 같은 말을 얼마나 자주 쓰는지 관찰하고, 연결의 언어인지 분리의 언어인지 물어 본다.',go:'debug',issue:'저출생'},
 {id:'4',part:1,label:'4장',title:'분절된 사고는 어떻게 문명이 되었는가',quote:'분리는 인류를 성장시켰다. 그러나 연결은 인류를 지속가능하게 만든다.',
  root:'분업과 전문화는 문명을 키웠지만 부분만 최적화하고 전체는 병드는 ‘합성의 오류’를 낳았다. 쪼개진 조각을 잇는 ‘연결 설계자’가 미래의 경쟁력이다.',
  qs:['각자의 역할만 다하다가 전체 목적을 놓친 경험이 있나요?','단편적인 부분만 고치려다 다른 부작용을 만든 사례는 무엇인가요?','서로 다른 두 분야나 사람을 연결해 새로운 가치를 만들 수 있는 아이디어가 주변에 있나요?'],
  lab:'성공/실패/능력/가난/교육/공동체를 적고 각 단어 옆에 “반드시 그럴까?”를 달아 본다.',go:'debug'},
 {id:'5',part:2,label:'5장',title:'연결은 새로운 발견이 아니라 원래 존재하던 질서였다',quote:'우리가 잃어버린 것은 연결이 아니라, 연결을 바라보는 시선이다.',
  root:'연결은 새로 발명된 기술이 아니라 본래의 질서다. 단순한 디지털 ‘접속’을 넘어 신뢰와 협력이 흐르는 관계의 ‘온도’를 올리는 것이 과제다.',
  qs:['나는 사람들과 통로만 열린 ‘접속’의 관계인가요, 신뢰가 오가는 ‘연결’의 관계인가요?','단편적인 시각에 갇혀 본래의 연결성을 놓치고 있는 문제는 무엇인가요?','서로 만나지 못해 잠들어 있는 두 자원이나 사람을 잇는다면 무엇이 태어날까요?'],
  lab:'내 주변에서 서로 만나지 못한 두 사람이나 자원을 하나 찾아 이어 줄 방법을 적어 본다.',go:'canvas'},
 {id:'6',part:2,label:'6장',title:'보이지 않는 연결이 세상을 움직인다',quote:'우리는 눈앞의 사건을 보지만, 세상은 보이지 않는 관계에 의해 움직인다.',
  root:'사건은 보이지만 세상을 움직이는 관계는 보이지 않는다. 촘촘한 연결망이 회복탄력성의 비밀이며, 증상만 고치는 시대를 넘어 보이지 않는 관계를 살펴야 한다.',
  qs:['최근 스트레스의 눈앞 사건 뒤에 숨어 있는 보이지 않는 원인(관계)은 무엇인가요?','우리 조직이나 지역이 작은 충격에도 흔들리는 것은 어떤 완충 연결망이 부족해서일까요?','증상 대신 환경과 관계를 돌볼 방법은 무엇인가요?'],
  lab:'',go:'debug'},
 {id:'7',part:2,label:'7장',title:'시스템은 사건을 만들고, 사건은 다시 시스템을 강화한다 (Upstream)',quote:'우리는 불이 난 곳으로 달려간다. 그러나 불이 왜 반복해서 나는지는 좀처럼 묻지 않는다.',
  root:'사건은 강 하류에서 터지지만 미래는 강 상류에서 설계된다. 사람을 탓하기보다 사람이 합리적으로 행동하게 만드는 구조와 기본값을 본다.',
  qs:['매일 바쁘게 물을 퍼내고 있는 ‘하류의 증상’은 무엇인가요?','그 문제가 반복되는 ‘상류’의 무너진 구조나 규칙은 무엇일까요?','문제 발생 자체를 막을 기본값이나 규칙 개혁은 무엇일까요?'],
  lab:'',go:'method:up'},
 {id:'8',part:2,label:'8장',title:'시계는 고쳐도 되고, 숲은 함께 살아야 한다',quote:'시계는 부품의 합이지만, 숲은 관계의 합이다.',
  root:'기계는 부품을 갈면 되지만 살아 있는 시스템은 관계망 전체를 돌봐야 산다. 외부 통제는 에너지를 고갈시키고, 신뢰가 만드는 자기조직화가 생명력을 만든다.',
  qs:['내 일터는 사람을 생명체로 대하나요, 교체 가능한 부품으로 대하나요?','문제가 터졌을 때 부품 하나만 바꾸려다 관계와 환경을 놓친 적이 있나요?','외부 지시 없이도 좋은 질서가 생기려면 어떤 신뢰와 자율성이 필요할까요?'],
  lab:'',go:'debug'},
 {id:'9',part:2,label:'9장',title:'전체는 부분의 합보다 크다 (창발과 프레스턴 모델)',quote:'한 사람은 세상을 바꾸기 어렵다. 그러나 연결된 사람들은 새로운 세상을 만든다.',
  root:'창발은 없는 자원을 새로 만드는 것이 아니라 이미 곁에 있던 자원 사이의 연결 고리를 다시 놓는 일에서 시작된다.',
  qs:['내 일터나 공동체는 스펙과 경쟁을 부추기나요, 서로 다른 사람이 만나 가능성을 창발시키나요?','연결되지 않은 채 잠들어 있는 자원이나 사람은 누구인가요?','새 예산 없이 기존 연결 고리를 바꿔 활력을 만들 방안은 무엇인가요?'],
  lab:'',go:'canvas',issue:'지역소멸'},
 {id:'10',part:3,label:'10장',title:'사고는 어떻게 사회의 시스템이 되는가 (재귀 구조)',quote:'인간은 사회를 만들지만, 자신이 만든 사회에 의해 다시 만들어진다.',
  root:'인지적 지름길 → 반복 행동 → 개인 습관 → 집단 규범 → 조직 관행 → 공식 제도화의 6단계로 사고가 시스템이 되고, 시스템은 다시 사고를 만든다. 자동화 자체는 못 벗어나도 성찰의 선순환이 되게 기본값을 설계할 수 있다.',
  qs:['“원래 우리 조직은 그래”라는 행동 중 처음에는 누군가의 편의에서 시작된 것은 무엇인가요?','우리 사회의 법과 제도가 내 사고를 어떤 방향으로 자라게 한다고 느끼나요?','나쁜 관성을 깨고 성찰과 협력이 저절로 일어나게 할 최소한의 장치는 무엇일까요?'],
  lab:'',go:'map:social'},
 {id:'11',part:3,label:'11장',title:'사고의 순환이 만들어내는 4대 사회적 병리',quote:'사회적 병리는 개별 정책의 실수가 아니다. 개인의 합리성이 집단의 비합리성으로 전환되는 사고 순환의 결과다.',
  root:'칸막이 행정, 각자도생, 단기성과주의, 경로의존성은 서로 다른 문제가 아니라 같은 순환이 낳은 공통의 병리다. 사람을 비난하기보다 의사결정의 기본값과 구조를 재설계해야 한다.',
  qs:['‘부서별 최적화’ 때문에 전체가 손해 본 칸막이 경험은 무엇인가요?','단기 성과지표를 채우느라 장기 자산을 잃은 적이 있나요?','불편한 줄 알면서도 QWERTY 자판처럼 고수하는 오랜 습관은 무엇인가요?'],
  lab:'',go:'debug',issue:'갈등과 혐오'},
 {id:'12',part:3,label:'12장',title:'System 2의 두 갈래 길: 폐쇄 순환과 개방 순환',quote:'느린 사고(System 2)는 항상 정직한 판사가 아니다. 때로는 내 신념을 우겨주는 변호사가 되고, 때로는 나를 고치는 성찰의 스위치가 된다.',
  root:'같은 느린 사고도 “내가 맞다”는 전제에서는 합리화의 변호사가 되고, “내가 틀릴 수도 있다”는 전제에서는 성찰의 스위치가 된다. 성찰 다짐만으로는 편향이 줄지 않으니 반대 증거 검토 같은 절차를 구조에 넣어야 한다.',
  qs:['최근 판단에서 “내가 맞다”는 증거만 찾았나요, “틀릴 수도 있다”며 반대 의견을 살폈나요?','우리 조직의 회의에는 반대 증거를 검토하게 하는 장치가 있나요?','AI에게 내 믿음을 강요하는 질문을 하나요, 내 맹점을 찾아 달라는 질문을 하나요?'],
  lab:'',go:'map:closed'},
 {id:'13',part:4,label:'13장',title:'통합적 사고: 코끼리와 다섯 장님',quote:'장님들의 대답은 저마다 참이었다. 문제는 그 다름을 틀림으로 바꾼 분별심과, 전체를 보지 못한 분절된 시야였다.',
  root:'통합적 사고는 모든 것을 아는 것이 아니라 쪼개진 부분들 사이의 관계를 읽는 시선이다. 서로 다른 지혜를 이어 전체 그림을 그리는 통합 설계자가 필요하다.',
  qs:['“내 분야가 아니야”라며 담을 쌓았지만 사실은 내 일과 연결된 것은 무엇인가요?','나와 다른 전문성의 말을 오답으로 배척했나요, 코끼리의 다른 면을 보여 주는 조각으로 받아들였나요?','우리 지역이나 조직의 복잡한 문제 뒤에서 서로 연결되는 서로 다른 세 분야는 무엇인가요?'],
  lab:'',go:'method:int'},
 {id:'14',part:4,label:'14장',title:'업스트림 사고와 구조적 설계',quote:'강에 빠진 사람을 건져내는 것도 소중한 용기다. 그러나 더 위대한 지혜는 왜 사람들이 계속 강에 빠지는지를 묻는 것이다.',
  root:'증상을 퍼내는 사람은 평생 소모되지만 상류에서 질문하는 사람은 문제가 반복되지 않는 구조를 디자인한다. 구호보다 강한 것은 시스템의 보이지 않는 규칙과 인센티브다.',
  qs:['매일 처리하는 일 중 당장의 증상만 가라앉히는 ‘하류의 처방’은 무엇인가요?','그 문제가 반복되는 ‘상류’의 구조나 규칙은 무엇일까요?','비난이나 노력 강요 대신 사람들이 저절로 협력하게 만드는 환경 구조는 무엇일까요?'],
  lab:'',go:'method:up'},
 {id:'15',part:4,label:'15장',title:'레버리지 포인트 (작은 변화가 세상을 바꾸는 지점)',quote:'세상을 바꾸는 것은 거대한 힘이 아니라, 올바른 지점을 찾는 지혜이다.',
  root:'성과는 노력의 총량이 아니라 레버리지의 정확성이 결정한다. 규칙, 기본값, 목적을 바꾸는 것이 힘이 세고, 가장 깊은 레버리지는 나 자신의 패러다임과 관점의 전환이다.',

  case:'한 중년 남성이 혈압, 당뇨, 불면증, 우울감으로 내과, 정형외과, 정신건강의학과를 돌며 각각 최선의 처방을 받았지만 고통은 사라지지 않습니다. 수면 부족은 스트레스를, 스트레스는 혈압을, 운동 부족은 당뇨를, 고립은 우울을 키우기 때문입니다. 몸은 하나의 시스템인데 증상이라는 부품만 따로 고쳤기 때문입니다.',
  apply:'저출생 — 경제(주거비), 노동(장시간·불안정), 교육(경쟁), 돌봄(독박)이 각자 한 면을 만지고 있습니다. 이어 붙이면 “집과 돌봄과 일자리가 모두 불안정한 삶”이라는 하나의 전체 그림이 보이고, 해법의 범위도 출산장려금을 넘어섭니다.',
  pit:['모든 분야의 지식을 혼자 다 아는 “만능 백과사전”이 되는 것이 아닙니다. 서로 다른 전문성 사이의 보이지 않는 관계를 읽는 능력입니다.','차이를 없애 똑같이 만드는 통합이 아닙니다. 차이를 유지한 채 서로를 살리는 구조를 설계하는 일입니다.','두 사람 중 한 명의 손을 들어주는 판사가 되지 않고, 두 관점을 이어 더 큰 그림을 그립니다.'],
  qs:['“내 분야가 아니야”라며 담을 쌓았지만 사실은 내 일과 깊이 연결된 것은 무엇인가요?','나와 다른 시각의 말을 ‘틀린 오답’으로 배척했나요, ‘소중한 조각’으로 끌어안았나요?','우리 지역이나 조직의 복잡한 문제 뒤에 숨은 서로 다른 세 분야의 연결 고리는 무엇일까요?'],
  ws:[['고른 문제','예: 청년이 지방을 떠난다'],['관점 ① — 분야·사람, 그리고 그들이 보는 것',''],['관점 ② — 분야·사람, 그리고 그들이 보는 것',''],['관점 ③ — 분야·사람, 그리고 그들이 보는 것',''],['연결 고리 — 서로 어떻게 이어져 있나','부딪히는 주장이 모두 부분적인 참이 되려면?'],['전체 그림 한 문장','']]},
 {k:'up',tab:'업스트림',name:'업스트림 사고',ch:'14',short:'상류로 거슬러 오른다',
  tag:'문제가 발생한 곳이 아니라, 문제가 시작된 곳을 묻는 사고',
  from:'“누가 잘못했는가? 누구를 비난하고 처벌할 것인가?”',
  to:'“어떤 구조와 규칙이 사람들에게 이 행동을 반복하게 만드는가?”',
  story:'마을 사람들은 강 하류로 떠내려오는 사람들을 구하려고 구명보트를 들이고 응급실까지 세웠습니다. 그래도 사람들은 계속 떠내려왔습니다. 강 상류로 올라간 노인이 발견한 것은 무너진 나무다리의 난간과, 밤에 길을 비출 등불 하나 없는 산길이었습니다. 난간을 고치자 하류의 응급실은 한가해졌습니다.',
  steps:[['증상을 확인한다','지금 내가 보고 있는 것은 문제의 결과(증상)인가요, 원인인가요?'],
   ['상류를 추적한다','이 문제는 그 이전에 어떤 구조적 배경에서 시작되었나요?'],
   ['규칙을 탐색한다','이 상황을 계속 되풀이하게 만드는 보이지 않는 규칙이나 기본값은 무엇인가요?'],
   ['장기 설계를 해 본다','만약 10년 동안 이 문제를 뿌리 뽑아야 한다면 오늘 무엇을 바꾸겠습니까?'],
   ['시선을 전환한다','그 변화는 사람을 바꾸는 것인가요, 구조를 다시 설계하는 것인가요?']],
  case:'사장이 해마다 “창의적으로 도전하라”고 외쳤지만 아무도 새로운 시도를 하지 않았습니다. 살펴보니 한 번이라도 실패하면 인사고과에서 큰 불이익을 받았고, 회의에서 상사에게 반대하면 승진에서 탈락하는 구조가 있었습니다. 직원들은 창의성이 없는 것이 아니라 구조 속에서 가장 합리적으로 행동한 것이었습니다.',
  apply:'저출생 — 하류에서는 출산 지원금을 몇백만 원 더 줍니다. 상류에는 치솟는 주거비, 불안정한 일자리, 장시간 노동, 경쟁적 교육, 미래에 대한 불안이 얽혀 있습니다. 출산은 원인이 아니라 삶의 구조가 무너졌음을 알리는 마지막 결과 신호입니다.',
  pit:['하류의 노력도 소중하고 필요합니다. 대체가 아니라 병행입니다. 당장 고통받는 사람을 구하면서 상류도 묻습니다.','사람을 탓하는 것은 쉽고, 구조를 바꾸는 것은 지혜를 요구합니다.','하나의 원인을 콕 집는 일이 아닙니다. 여러 원인이 얽힌 그물을 거슬러 오릅니다.'],
  qs:['매일 바쁘게 처리하는 일 중 증상만 가라앉히는 ‘하류의 처방’은 무엇인가요?','그 문제가 반복되는 ‘상류’의 무너진 구조나 규칙은 무엇일까요?','비난이나 노력 강요 대신 사람들이 저절로 협력하게 만드는 환경은 어떻게 바꿀 수 있을까요?'],
  ws:[['고른 문제','가장 까다로웠던 문제 하나'],['하류의 처방 — 지금 내가 하고 있는 일',''],['지금 보는 것은 증상인가, 원인인가',''],['상류의 구조 — 이 문제가 시작된 곳',''],['되풀이하게 만드는 규칙·기본값',''],['10년 동안 뿌리 뽑는다면 오늘 바꿀 것',''],['사람을 바꾸는가, 구조를 설계하는가','']]},
 {k:'str',tab:'구조적',name:'구조적 사고',ch:'14',short:'규칙과 인센티브를 본다',
  tag:'사람을 바꾸려 하기 전에, 사람이 그렇게 행동하게 만드는 구조를 보고 설계하는 사고',
  from:'“요즘 사람들은 노력이 부족해.” 훈계와 구호',
  to:'“어떤 규칙, 인센티브, 정보의 흐름, 목적이 이 행동을 만들고 있는가?”',
  story:'숲은 나무에게 “열심히 열매를 맺어라”라고 강요하지 않습니다. 토양을 기름지게 하고, 물길이 순환하게 하고, 햇살과 미생물이 살 환경을 먼저 설계합니다. 좋은 구조가 차려지면 생명은 지시하지 않아도 스스로 자라 풍성한 열매를 맺습니다. 사람은 공중에 떠서 행동하지 않고, 자기가 속한 구조가 허용하는 보이지 않는 인센티브와 규칙 안에서 가장 합리적인 선택을 하고 있을 뿐입니다.',
  steps:[['반복되는 행동을 확인한다','사람들이 되풀이하는 행동을 사람의 결함이 아니라 구조 속의 합리적인 생존 선택으로 바라봅니다.'],
   ['그 행동을 부추기는 구조를 찾는다','인사고과, 성과지표, 서식, 평가 방식, 정보가 흐르는 길처럼 보이지 않는 규칙과 인센티브를 찾습니다.'],
   ['구조의 어느 층인지 구분한다','수치(파라미터), 피드백 고리, 규칙과 기본값, 목적과 패러다임 중 어디에 걸려 있는지 구분합니다. (레버리지 포인트에서 이어집니다)'],
   ['사람을 바꾸는 대신 구조를 바꾼다면','같은 사람이 다르게 행동할 수 있도록 어떤 규칙이나 환경을 바꿀지 적어 봅니다.'],
   ['작은 시제품으로 시험한다','30일 안에 해볼 수 있는 가장 작은 실험으로 바꿉니다. (미래 설계 탭)']],
  case:'좋은 의사는 당장의 병을 치료하지만 위대한 의사는 병이 생겨나지 않는 건강한 일상의 생태계를 만듭니다. 좋은 교사는 수업을 잘하지만 위대한 교사는 아이들이 스스로 배움을 이어 가는 성장 환경을 만듭니다. 좋은 리더는 사람을 통제하지만 위대한 리더는 구성원이 스스로 도전하고 성장할 수 있는 제도적 구조를 설계합니다.',
  apply:'교육 — 아이들이 배움의 기쁨을 잃었다고 평가를 늘리고 사교육으로 내모는 것은 하류에서 그물을 넓게 치는 일입니다. 정답 하나만 맞혀야 살아남는 시험 구조, 실패를 허용하지 않는 분위기, 성적으로 인격을 서열화하는 구조를 고치지 않는 한 어떤 새 교육 정책도 아이들을 살리지 못합니다.',
  pit:['구조를 보라는 것은 개인의 책임을 없애자는 뜻이 아니라, 반복되는 행동의 원인을 정확히 찾자는 뜻입니다.','구호나 지시보다 강한 것은 언제나 시스템의 보이지 않는 규칙과 인센티브입니다.','구조를 바꾸는 일은 사람을 비난하는 것보다 어렵습니다. 그래서 작게 시작해서 시험합니다.'],
  qs:['매일 처리하는 일 중 증상만 가라앉히는 ‘하류의 처방’은 무엇인가요?','사람을 비난하거나 노력을 강요하는 대신 사람들이 저절로 협력하고 도전하게 만드는 환경 구조를 어떻게 바꿀 수 있을까요?','내 조직에서 사람들이 소극적인 이유는 능력이 아니라 어떤 구조 때문일까요?'],
  ws:[['고른 문제','가장 크게 얽혀 있는 고민 하나'],['반복되는 행동',''],['그 행동을 부추기는 구조 — 규칙·인센티브·정보의 흐름',''],['구조의 어느 층인가 — 수치 / 피드백 / 규칙·기본값 / 목적',''],['사람이 아니라 구조를 바꾼다면 무엇을',''],['가장 작은 개입 (30일 안에)','']]},
 {k:'lev',tab:'레버리지',name:'레버리지 포인트 사고',ch:'15',short:'작은 힘으로 큰 변화를 만드는 지점',
  tag:'많이 투입하는 것이 아니라, 제대로 된 지점을 찾는 사고',
  from:'“더 많은 예산, 더 많은 사업, 더 많은 인력을 투입하자”',
  to:'“가장 작은 힘으로 가장 큰 선순환을 일으킬 지점, 수도꼭지는 어디인가?”',
  story:'한 아이가 길 한가운데 놓인 바위를 온 힘으로 밀었지만 꿈쩍도 하지 않았습니다. 지나가던 노인이 바위 아래 작은 돌을 받치고 긴 막대기를 걸친 뒤 “여기만 살짝 눌러 보렴”이라고 했습니다. 바위는 천천히 움직였습니다. “힘이 부족했던 것이 아니라 힘을 써야 할 지점을 몰랐던 거란다.” 욕실 바닥에 물이 넘칠 때 모두가 걸레질과 물 퍼내기에 바쁜 사이, 한 사람이 조용히 수도꼭지를 잠급니다.',
  steps:[['가장 힘을 쏟는 곳을 본다','에너지와 예산을 가장 많이 쓰는 곳이 바닥의 물을 퍼내는 하류는 아닌지 확인합니다.'],
   ['지금의 개입 수준을 확인한다','수치나 예산을 조금 조절하는 ‘파라미터’ 수준에 머물고 있지 않은지 아래 사다리에서 확인합니다.'],
   ['사다리를 한 칸 올려 본다','피드백 루프, 규칙과 기본값, 목적과 패러다임 중 한 칸 위에서 무엇을 바꿀 수 있는지 묻습니다.'],
   ['수도꼭지를 고른다','가장 작은 힘으로 선순환을 일깨울 한 지점을 정합니다.'],
   ['작게 시험한다','30일 안에 시험하고 어떤 반응이 오는지 관찰합니다.']],
  ladder:[['① 파라미터 조정 · 가장 약한 개입','예산 액수를 조금 바꾸거나 보조금을 늘리거나 규제 수치를 살짝 조절하는 일. 하류에서 퍼내는 물의 양을 조절하는 것에 불과합니다.'],
   ['② 피드백 루프 변경 · 중간 개입','시스템이 스스로를 조절하는 되먹임 고리를 강화하거나 약화하고, 누가 어떤 정보를 언제 볼 수 있는지 그 통로를 바꾸는 일.'],
   ['③ 규칙과 디폴트 변경 · 강한 개입','보상과 처벌, 허용과 금지, 아무것도 하지 않았을 때의 기본값을 바꿔 선택의 판 자체를 다시 짜는 일.'],
   ['④ 패러다임과 목적의 전환 · 가장 강력한 개입','“이 시스템이 지향하는 궁극적인 가치는 무엇인가?”라는 질문을 바꾸는 일. 메도우즈는 그 너머에 하나 더, 어떤 패러다임도 절대적이지 않음을 알고 필요할 때 넘어설 수 있는 힘을 가장 높은 자리에 두었습니다.']],
  case:'교육 문제를 풀려고 교과서를 새로 만들고, 시험 수치를 바꾸고, 시설을 현대화하는 것은 파라미터 조정이라는 약한 개입입니다. 더 강력한 지점은 “교육의 궁극적 목적은 무엇인가”라는 질문입니다. 목적이 ‘줄 세우기와 좋은 대학 진학’이면 모든 교실이 경쟁의 사슬로 흐르고, ‘함께 살아가는 좋은 시민을 기르는 것’으로 바뀌면 평가도 수업도 학교의 구조도 저절로 달라지기 시작합니다.',
  apply:'지역소멸 — 출산 지원금이나 귀농 지원금을 올리는 것은 순환 고리에 칠하는 윤활유일 뿐, 고리 자체가 없으면 금방 마릅니다. 진짜 레버리지 포인트는 사람과 자원이 모여 가치를 순환시키는 운영체계(OS)를 설계하고, 끊어진 순환 고리를 이어 붙이는 곳입니다.',
  pit:['성과는 노력의 총량이 아니라 레버리지의 정확성이 결정합니다.','파라미터 조정은 눈에 보이고 정치적 성과를 내기 좋습니다. 상류의 강한 개입은 성과가 더디게 나타날 수 있지만, 같은 예산과 시간으로 훨씬 큰 선순환을 만듭니다.','AI는 데이터를 처리하고 시뮬레이션하지만, 결정적인 변화의 지점이 어디인지 찾는 것은 인간의 철학과 통찰입니다.'],
  qs:['내가 가장 많은 에너지와 예산을 쓰는 곳은 어디인가요? 혹시 바닥의 물을 퍼내는 하류는 아닌가요?','문제를 바꾸기 위해 예산이나 수치를 조금 조절하는 ‘약한 개입’에 머물고 있지 않나요?','가장 작은 힘으로 가장 큰 선순환을 일깨울 나의 ‘수도꼭지’는 어디에 있을까요?'],
  ws:[['고른 문제','가장 크게 얽혀 있는 고민 하나'],['가장 많은 에너지·예산을 쓰는 곳 (하류는 아닌가)',''],['① 파라미터 — 시간이나 돈 같은 수치만 조절하려 하고 있는가',''],['② 피드백 — 누가 어떤 정보를 언제 보게 바꿀 수 있나',''],['③ 규칙·디폴트 — 반복되지 않도록 바꿀 수 있는 기본 행동 규칙은',''],['④ 목적·패러다임 — 궁극적 목적은 무엇이고, 내 관점을 바꾸면 무엇이 달라지나',''],['내가 고른 수도꼭지 — 가장 작은 힘으로 선순환을 일으킬 지점','']]},
 {k:'def',tab:'디폴트',name:'디폴트 설계',ch:'17',short:'기본값을 바꿔 선택의 판을 짠다',
  tag:'마음을 설득하려 하지 말고, 판의 기본값을 설계하는 사고',
  from:'“여러분, 적극적으로 의견을 내세요!” 마음을 설득하는 호소 (약한 개입)',
  to:'“아무것도 하지 않았을 때 작동하는 기본값을 바꾸면, 좋은 선택이 저절로 일어나지 않을까?”',
  story:'독일과 오스트리아는 문화적·경제적으로 비슷한 이웃 나라입니다. 그런데 장기기증 희망 등록에서 큰 격차가 났습니다. 국민성이 달라서가 아니었습니다. 독일은 직접 신청서를 써야 등록되는 옵트인, 오스트리아는 거부 의사를 밝히지 않으면 자동으로 등록되는 옵트아웃을 기본값으로 삼았습니다. 사람들은 좋은 취지에 동의하면서도 번거로움 때문에 행동을 미루었고, 기본값이 그 행동을 대신했습니다.',
  steps:[['현재의 기본값을 찾는다','아무 생각 없이 내버려 두면 작동하는 기본값이 무엇인지 찾습니다. (예: 침묵, 경쟁, 소비, 개별 처리)'],
   ['두 가지 대안을 나란히 적는다','“마음을 설득하는 대안”과 “기본값을 바꾸는 대안”을 비교해 적습니다.'],
   ['좋은 선택이 저절로 되도록 바꾼다','서식, 절차, 회의 규칙, 신청 방식의 기본값을 바꿉니다. 원치 않는 사람은 빠져나갈 수 있게 합니다.'],
   ['스스로 생각할 기회를 지킨다','정해 준 기본값이 사람들의 깊은 생각을 슬쩍 앗아가지 않는지 점검하고, 함께 생각하는 자리도 둡니다.'],
   ['작게 시험하고 관찰한다','30일 안에 시험해 보고 사람들의 반응을 관찰합니다.']],
  case:'퇴직연금을 직원이 직접 신청해야 가입되는 방식에서 입사와 동시에 자동 가입되고 원치 않으면 빠져나가는 방식으로 바꾸자 노후 자산 형성 비율이 크게 늘었습니다. 영국 프레스턴에서는 공공기관이 물건을 살 때 지역 기업 조달을 기본값으로 정하자 지역의 돈과 일자리가 돌기 시작했습니다. 회의에서 모든 구성원이 반대 관점을 한 가지 이상 제출하게 하는 절차는 집단사고를 막습니다.',
  apply:'회의 참여 높이기 — 설득: “자유롭게 의견을 내세요!”라고 매번 강조합니다(약한 개입). 디폴트: 회의 시작 전 모든 참석자가 익명으로 의견 포스트잇 한 장씩을 제출해야 회의가 시작되도록 규칙을 바꿉니다(강한 개입). 칸막이, 각자도생, 단기성과 같은 병리는 어쩌면 단절과 경쟁이 기본값인 시스템에서 살고 있기 때문입니다.',
  pit:['기본값만으로 모든 것이 풀리지는 않습니다. 정해 준 기본값이 사람들의 스스로 생각할 기회를 앗아갈 수 있어서, 구조를 바꾸는 일과 스스로 생각해 보는 일은 함께 굴러가야 하는 두 바퀴입니다.','사람의 에너지 절약 본능(현재 상태 편향)을 탓하지 않고 오히려 지렛대로 삼습니다.','기본값은 협력과 신뢰, 지속가능성 쪽으로 설계해야 합니다. AI도 사용자 입맛에 맞춘 답을 기본값으로 삼으면 확증편향의 증폭기가 되고, 반대 관점을 함께 제시하는 것을 기본값으로 삼으면 성찰의 파트너가 됩니다.'],
  qs:['내 회사·학교·가정에서 아무 생각 없이 두면 작동하는 ‘현재의 기본값’은 무엇인가요?','마음을 일일이 설득하는 대신 좋은 행동이 선택되도록 바꿀 서식이나 절차의 기본값은 무엇일까요?','내가 원하는 삶이 자동으로 실행되도록 환경의 기본값을 바꿀 작은 부분은 무엇인가요?'],
  ws:[['고른 문제','회의 참여, 가족의 대화, 지역 모임 등'],['현재의 기본값 — 아무것도 하지 않으면 작동하는 것',''],['마음을 설득하는 대안 (약한 개입)',''],['기본값을 바꾸는 대안 (강한 개입)',''],['스스로 생각할 기회는 어떻게 지킬까',''],['30일 안에 시험해 볼 가장 작은 기본값 변경','']]},
 {k:'fb',tab:'피드백',name:'시스템 피드백 설계',ch:'7·12·19',short:'되먹임 고리를 설계한다',
  note:'책에서는 7장(레버리지 4단계의 ‘피드백 루프 변경’), 11장(악순환의 피드백 루프), 12장(닫힌·열린 순환), 19장(실패를 데이터로 공유)에 나뉘어 나옵니다. 앱에서는 이를 하나의 사고법으로 묶어 정리했습니다.',
  tag:'시스템이 스스로를 조절하는 되먹임 고리와 정보의 통로를 설계하는 사고',
  from:'“더 열심히 해 주세요.” 결과를 보고만 하는 한 방향의 통제',
  to:'“이 결과가 누구에게, 언제, 어떤 정보로 돌아가 다음 행동을 바꾸는가?”',
  story:'항공 산업은 비행 사고나 미세한 결함이 생기면 개인을 비난하고 처벌하는 데서 멈추지 않았습니다. 사고의 원인을 정밀하게 기록해 전 세계 항공사와 투명하게 공유하고, 같은 실수가 반복되지 않도록 매뉴얼과 기체 시스템 자체를 고쳤습니다. 개인의 실수를 집단의 학습 자산으로 바꾼 되먹임 고리가 항공을 가장 안전한 수송 수단으로 만들었습니다.',
  steps:[['반복되는 고리를 그린다','결과가 다시 원인이 되는 순환을 그려 봅니다. (예: 불신 → 각자도생 → 공동체 해체 → 더 큰 불신)'],
   ['끊을 고리와 키울 고리를 정한다','악순환을 키우는 고리는 약화하고, 성찰·학습·협력을 키우는 선순환 고리는 강화합니다.'],
   ['정보의 통로를 점검한다','누가 어떤 정보를 언제 볼 수 있나요? 결과가 늦게, 일부에게만 돌아가고 있지 않은지 살핍니다.'],
   ['반대 증거와 실패가 돌아오게 한다','반대 관점을 검토하는 절차, 실패의 기록과 공유처럼 틀렸음을 알려 주는 정보가 시스템에 돌아오게 만듭니다.'],
   ['작게 시험하고 피드백을 모은다','30일 실험의 관찰 지표와 실패의 데이터화를 미리 정해 배움이 돌아오게 합니다.']],
  case:'핀란드는 전국적인 교육 개혁을 정해진 정답으로 아래에 강요하지 않았습니다. 작은 학교 단위로 시범 프로젝트를 하게 하고, 현장 교사와 아이들의 피드백을 모아 문제점을 계속 보완한 뒤 단계적으로 확산했습니다. 성공을 만든 것은 거대한 구호나 예산이 아니라 끊임없이 학습하고 적응하는 시스템의 유연함이었습니다.',
  apply:'닫힌 순환과 열린 순환 — “내가 맞다”에서 출발하면 합리화, 편향 강화, 고착, 집단사고, 오류의 사회화, 공식 제도화로 각 단계가 앞 단계의 편향을 검증 없이 키웁니다. “내가 틀릴 수도 있다”에서 출발하면 성찰, 편향 약화, 관점 전환, 새로운 학습, 새로운 시도, 새 패턴의 내면화로 스스로를 교정합니다. 이 열린 순환이 유지되도록 반대 증거 검토 절차를 구조에 넣는 것이 피드백 설계입니다.',
  pit:['성찰하겠다는 마음가짐만으로는 편향이 줄지 않습니다. 반대 증거를 반드시 검토하게 하는 절차처럼 피드백을 구조에 넣어야 합니다.','실패를 처벌의 대상이 아니라 배움의 데이터로 다룹니다. 실패란 목표를 이루지 못한 상태가 아니라, 배움을 얻지 못한 채 멈춰 선 상태입니다.','피드백 루프 변경은 레버리지 사다리의 중간 개입입니다. 수치 조정보다 강하지만 규칙·기본값·목적의 전환과 함께 쓸 때 힘이 커집니다.'],
  qs:['우리 조직의 회의 절차에는 구성원이 편향에 빠지지 않도록 돕는 ‘반대 증거 검토 장치’가 있나요?','최근의 시행착오 중 다음 진화를 위한 귀중한 데이터로 바꿀 배움은 무엇인가요?','내 문제에서 결과가 원인에게 돌아오지 못하게 막는 곳, 정보가 늦거나 막혀 있는 곳은 어디인가요?'],
  ws:[['고른 문제','결과가 반복되는 문제 하나'],['결과가 다시 원인이 되는 고리 — 한 줄로 그려 보기',''],['약화할 악순환 고리',''],['강화할 선순환 고리',''],['정보의 통로 — 누가 어떤 정보를 언제 보게 할까',''],['반대 증거·실패가 돌아오게 할 장치',''],['30일 실험의 관찰 지표','']]},
 {k:'back',tab:'백캐스팅',name:'백캐스팅 사고법',ch:'16',short:'미래에서 오늘로 역산한다',
  tag:'원하는 미래를 먼저 정의하고, 거꾸로 오늘을 설계하는 사고',
  from:'예측(Forecasting): “지금의 기술과 추세로 무엇이 가능할까?”',
  to:'백캐스팅: “10년 뒤 원하는 미래가 되려면 5년 전에는, 그리고 오늘은 무엇을 해야 하는가?”',
  story:'1961년 케네디 대통령은 “10년이 끝나기 전에 인간을 달에 보내겠다”고 선언했습니다. 당시 기술로는 불가능해 보였지만 그는 “지금 기술로 갈 수 있을까?” 대신 “5년 전에는 어떤 기술이, 3년 전에는 어떤 수송선이 완성되어 있어야 하는가, 오늘 무엇을 시작해야 하는가”를 물었습니다. 그 질문이 수많은 과학자와 기업, 대학을 하나의 목표로 묶었고, 1969년 아폴로 11호가 달에 닿았습니다.',
  steps:[['미래의 완성을 그린다','10년 뒤 우리 일터·지역·가족이 가장 건강하고 지속가능하게 변한 모습을 선명하게 그립니다. 그 시점에서 오늘의 나에게 편지를 쓴다고 상상해 보세요.'],
   ['역산한다','그 미래가 현실이 되려면 5년 전에는 어떤 제도나 환경이 이미 만들어져 있어야 하나요? 3년 전에는요?'],
   ['현재의 제약을 확인한다','“예산이 이것밖에 없으니까”, “과거부터 이렇게 해왔으니까” 같은 제약이 미래를 가두고 있지 않은지 살핍니다.'],
   ['오늘의 결단을 내린다','오늘 버릴 습관은 무엇이고, 시작할 가장 작은 첫걸음은 무엇인가요?'],
   ['30일 실험으로 옮긴다','30일 안에 시작해 배울 수 있는 실험 하나로 바꿉니다. (미래 설계 탭의 캔버스)']],
  case:'UN의 지속가능발전목표(SDGs)는 2030년까지 빈곤 퇴치, 기후위기 대응, 양질의 교육 같은 17가지 미래 상태를 먼저 정해 두었습니다. 그 목표가 각국의 공공 정책, 기업의 ESG 경영, 시민사회의 행동을 끌어당기는 나침반으로 작동하고 있습니다.',
  apply:'예시 · 지역 — 10년 뒤 청년이 이 지역에서 배우고 일하며 신뢰하는 공동체를 누리는 모습을 먼저 정합니다. 그러면 5년 전에는 이미 있는 자원을 잇는 순환 구조가 돌고 있어야 하고, 오늘은 서로 단절된 자원 하나를 잇는 작은 실험을 시작하게 됩니다.',
  pit:['막연한 희망 사항을 늘어놓는 일이 아닙니다. 통합적·업스트림·구조적 사고가 맞물려 작동하는 정교한 설계입니다.','현재의 제약과 과거 추세에만 매달리는 예측은 경로의존성을 강화할 뿐입니다.','AI가 시나리오를 시뮬레이션해도 어떤 미래를 선택할지의 가치와 목적은 인간이 정합니다.'],

 '<a href="#/methods"><b>사고법</b><span>통합적 · 업스트림 · 구조적 · 레버리지 · 디폴트 · 피드백 · 백캐스팅. 문제를 전체와 구조로 보고 미래를 설계하는 일곱 가지 방법.</span></a>'+
 '<a href="#/book"><b>책과 함께</b><span>장별 질문과 실험, 깊이 읽기. 밑줄 친 문장을 디버깅으로 가져갑니다.</span></a>'+

 '<div class="card" style="margin-top:18px"><h3>이렇게 쓰세요</h3><ol class="hint" style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px"><li>책을 읽다 마음이 걸리는 문장이나 사회문제를 하나 고릅니다.</li><li>지도에서 그 생각이 순환의 어느 지점에 있는지 확인합니다.</li><li>디버깅으로 “생각의 틈”을 만들고, 작은 선택까지 기록합니다.</li><li>‘내 기록’에서 확신이 어떻게 달라졌는지, 생각과 나 사이에 거리가 생겼는지 되돌아봅니다.</li></ol></div>'+

  F.hot.map(function(h,i){var l=(h[0]-h[2]/2)/F.w*100,t=(h[1]-h[3]/2-35*F.w/1483)/F.h*100,w=h[2]/F.w*100,hh=(h[3]+35*F.w/1483)/F.h*100;

}

/* ---------- 뷰: 미래 설계 ---------- */
function cv(k,ph,h){return '<textarea data-cv="'+k+'" id="cv_'+k+'" placeholder="'+esc(ph||'')+'"'+(h?' style="min-height:'+h+'px"':'')+'>'+esc(DB.canvas[k]||'')+'</textarea>'}
function canvasText(){var c=DB.canvas;return ['[미래 설계 캔버스]'].concat(CANVAS.map(function(x,i){return (i+1)+'. '+x[0]+': '+(c['c'+i]||'')})).concat(['','[30일 미래 실험 카드]']).concat(CARD.map(function(x,i){return x[0]+': '+(c['e'+i]||'')})).concat(['','[미래 설계 선언문]']).concat(DECL.map(function(x,i){return x+'\n→ '+(c['d'+i]||'')})).join('\n')}
function vCanvas(){
 return '<header class="sec" style="gap:12px;margin-bottom:18px"><div class="eyebrow">미래 설계</div><h1>완벽한 계획보다 작은 실험</h1><p class="lead">책 19장의 5단계 캔버스와 30일 미래 실험 카드, 에필로그의 선언문입니다. 미래는 서류함 속의 완벽한 계획서가 아니라 작은 시제품을 반복하며 배우는 사람들의 손에서 태어납니다. 비워 둔 칸이 있어도 괜찮습니다. 내용은 이 기기에 자동 저장됩니다.</p></header>'+
 '<div class="card"><h2>5단계 미래 설계 캔버스</h2>'+CANVAS.map(function(x,i){return '<div class="sec"><span class="label">STEP '+(i+1)+'. '+esc(x[0])+'</span><span class="hint">'+esc(x[1])+'</span>'+cv('c'+i,'',72)+'</div>'}).join('')+'</div>'+
 '<div class="card" style="margin-top:18px"><h2>30일 미래 실험 카드</h2><p class="hint">실패란 목표를 이루지 못한 상태가 아니라, 배움을 얻지 못한 채 멈춰 선 상태입니다.</p>'+CARD.map(function(x,i){return '<div class="sec"><span class="label">'+(i+1)+'. '+esc(x[0])+'</span><span class="hint">'+esc(x[1])+'</span>'+cv('e'+i,'',64)+'</div>'}).join('')+'</div>'+
 '<div class="card" style="margin-top:18px"><h2>미래 문명을 떠받치는 다섯 기둥</h2><div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">'+PILLARS.map(function(p){return '<div class="box"><b>'+esc(p[0])+'</b>'+esc(p[1])+'</div>'}).join('')+'</div><p class="hint">다섯 기둥은 순서대로 세우는 단계가 아니라 동시에 존재해야 하는 생태계입니다. 아래 선언문의 괄호를 나만의 말로 채워 보세요.</p>'+
 DECL.map(function(x,i){return '<div class="sec"><span class="label">'+esc(x)+'</span>'+cv('d'+i,'괄호 안에 들어갈 내 말',56)+'</div>'}).join('')+
 '<div class="row"><button class="btn ghost" data-act="copyCanvas">전체 복사</button><button class="btn ghost" data-act="saveCanvas">파일로 저장</button><span class="note" id="cvMsg" role="status"></span></div></div>';
}

/* ---------- 뷰: 내 기록 ---------- */
function recText(r){
 var f=r.f||{},b0=f.belief0,b1=f.belief1,has=function(v){return v!=null&&v!==''};
 return ['[잠깐! 진짜?] 나의 사고 디버깅 기록 ('+r.date+')',r.issue?'사회문제: '+r.issue:'','처음 생각: '+r.thought,r.source?'가져온 곳: '+r.source:'',has(b0)?'처음 확신도: '+b0+'%':'',
  f.q1?'사실·해석·가능성: '+f.q1:'',f.q3?'생각의 뿌리: '+f.q3:'',f.q1fact?'확인한 사실: '+f.q1fact:'',f.q1interp?'내 해석: '+f.q1interp:'',f.q2?'꼭 그래야 해?: '+f.q2:'',f.q4a?'다르게 보면: '+f.q4a:'',f.gap?'생각의 틈(다른 가능성): '+f.gap:'',
  f.before?'자동으로 작동하던 틀: '+f.before:'',f.after?'새로 열어 본 해석: '+f.after:'',f.q5?'나의 선택: '+f.q5:'',f.keep?'계속 품고 갈 질문: '+f.keep:'',
  f.action?'작은 선택/실험: '+f.action:'',f.signal?'3초 멈춤 신호: '+f.signal:'',f.pred?'예상: '+f.pred:'',f.real?'실제 경험: '+f.real:'',f.found?'새로운 발견: '+f.found:'',f.obs?'관찰 지표: '+f.obs:'',f.failLearn?'실패의 데이터화: '+f.failLearn:'',
  has(b1)?'지금 확신도: '+b1+'%':'',has(f.dist)?'생각과 나 사이의 거리: '+f.dist+' / 5':''].filter(Boolean).join('\n');
}
function vNotes(){
 var rs=DB.records.slice().reverse();
 var list=rs.length?rs.map(function(r){var f=r.f||{},sh=(f.belief0!=null&&f.belief0!==''&&f.belief1!=null&&f.belief1!=='')?'<span class="tag">확신 '+esc(f.belief0)+'% → '+esc(f.belief1)+'%</span>':'',ds=(f.dist!=null&&f.dist!=='')?'<span class="tag">거리 '+esc(f.dist)+' / 5</span>':'';
  return '<div class="rec"><div class="row end"><b>'+esc(r.issue||'자유 주제')+'</b><span class="note">'+esc(r.date)+'</span></div><div class="hint">“'+esc(r.thought)+'”</div>'+((sh||ds)?'<div class="row">'+sh+ds+'</div>':'')+'<details><summary class="hint" style="cursor:pointer">전체 보기</summary><pre>'+esc(recText(r))+'</pre></details><div class="row"><button class="btn ghost sm" data-copy="'+r.id+'">복사</button><button class="btn ghost sm" data-resume="'+r.id+'">이 생각으로 다시 해 보기</button><button class="btn ghost sm" data-del="'+r.id+'">삭제</button></div></div>'}).join(''):'<p class="lead">아직 저장한 기록이 없습니다. 디버깅을 마치면 여기에 모입니다.</p>';
 return '<header class="sec" style="gap:12px;margin-bottom:18px"><div class="eyebrow">내 기록</div><h1>생각이 달라진 자리</h1><p class="lead">이 기기의 브라우저에만 저장됩니다. 확신도가 내려가지 않아도 괜찮습니다. 생각과 나 사이에 틈이 생겼는지를 살펴보세요. 브라우저 데이터를 지우면 사라지니 중요한 기록은 내려받아 보관하세요.</p></header>'+
 '<div class="row" style="margin-bottom:14px"><button class="btn ghost sm" data-act="exportJson"'+(rs.length?'':' disabled')+'>JSON 내려받기</button><button class="btn ghost sm" data-act="exportTxt"'+(rs.length?'':' disabled')+'>텍스트 내려받기</button><button class="btn ghost sm" data-act="importJson">불러오기</button><input type="file" id="imp" accept="application/json" hidden></div>'+
 '<div class="sec">'+list+'</div><div class="note" id="notesMsg" style="margin-top:12px" role="status"></div>';
}

/* ---------- 라우팅 / 렌더 ---------- */
var ROUTES=['home','debug','map','methods','book','canvas','notes'],ROUTE='home';
try{var h0=(location.hash||'').replace('#/','').replace('#','');if(ROUTES.indexOf(h0)>=0)ROUTE=h0}catch(e){}
function route(){return ROUTE}
function setRoute(r,keep){
 if(r==='debug'&&ROUTE!=='debug'&&!keep&&D.step===0&&!D.pause)D.started=false;
 ROUTE=r;render();window.scrollTo({top:0});
}
var pt=null;
function startPause(){
 clearInterval(pt);var b=$('#pauseGo');if(!b)return;var n=3;b.disabled=true;b.textContent='숨을 쉬는 중… '+n;
 pt=setInterval(function(){n--;var x=$('#pauseGo');if(!x){clearInterval(pt);return}if(n<=0){clearInterval(pt);x.disabled=false;x.textContent='계속하기';x.focus()}else x.textContent='숨을 쉬는 중… '+n},1000);
}
function render(){
 var r=route();
 document.querySelectorAll('.top a.tab').forEach(function(a){if(a.dataset.r===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 var c0=$('#cf');if(c0){c0.hidden=true;pend=null}
 clearInterval(pt);
 $('#view').innerHTML={home:vHome,debug:vDebug,map:vMap,methods:vMethods,book:vBook,canvas:vCanvas,notes:vNotes}[r]();
 if(r==='debug'&&D.started&&D.pause&&!D.busy)startPause();
}
function dGo(n){D.step=n;D.err='';save();render();window.scrollTo({top:0})}
async function dl(name,text,type){
 try{var d=await claude.use('downloads');if(d){await d.save({filename:name,data:text});return true}}catch(e){if(e&&e.code==='declined')return false}
 try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);return true}catch(e){}
 return false;
}
function showText(el,t){if(el)el.innerHTML='내려받기를 사용할 수 없어 아래에 내용을 표시합니다. 전체 선택해 복사하세요.<textarea readonly style="min-height:140px;margin-top:8px">'+esc(t)+'</textarea>'}
var pend=null;
function ask2(msg,fn){pend=fn;var c=$('#cf');c.hidden=false;c.innerHTML=esc(msg)+' <button class="btn sm" data-cf="y">확인</button> <button class="btn ghost sm" data-cf="n">취소</button>';c.scrollIntoView({block:'nearest'})}
function say(m){var e=$('#notesMsg');if(e)e.textContent=m}
function copy(t,after,box){(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){after('복사했습니다.')}).catch(function(){var m=box||$('#notesMsg');if(m)m.innerHTML='복사하지 못했습니다. 아래 내용을 선택해 복사하세요.<textarea readonly style="min-height:120px;margin-top:8px">'+esc(t)+'</textarea>'})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dUpd(){var g=$('#dGo0');if(g)g.disabled=!(D.issue.trim().length>0&&D.thought.trim().length>3);var h=$('#dIssueGo');if(h)h.disabled=!D.issue.trim().length}

/* ---------- 이벤트 ---------- */
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='dThought'){D.thought=t.value;save();dUpd()}
 else if(t.id==='dIssue'){D.issue=t.value.trim();document.querySelectorAll('[data-d-issue]').forEach(function(b){b.setAttribute('aria-pressed','false')});save();dUpd()}
 else if(t.dataset&&t.dataset.dAns!==undefined){D.ans[t.dataset.dAns]=t.value;save()}
 else if(t.dataset&&t.dataset.dFx!==undefined){D.ex[t.dataset.dFx]=t.value;save()}
 else if(t.id==='bkWhere'){bk.w=t.value}
 else if(t.id==='bkQuote'){bk.q=t.value}
 else if(t.id==='bkIssue'){bk.i=t.value;document.querySelectorAll('[data-bkissue]').forEach(function(b){b.setAttribute('aria-pressed','false')})}
 else if(t.dataset&&t.dataset.cv){DB.canvas[t.dataset.cv]=t.value;save()}
 else if(t.dataset&&t.dataset.mw){DB.methods[t.dataset.mw]=t.value;save()}
});
document.addEventListener('change',function(e){
 if(e.target.id!=='imp')return;
 var f=e.target.files[0];if(!f)return;var rd=new FileReader();
 rd.onload=function(){try{var d=JSON.parse(rd.result);if(!Array.isArray(d))throw 0;var have={};DB.records.forEach(function(r){have[r.id]=1});var n=0;d.forEach(function(r){if(r&&r.id&&(r.thought||r.issue)&&!have[r.id]){DB.records.push({id:String(r.id),date:String(r.date||''),issue:String(r.issue||''),thought:String(r.thought||''),source:String(r.source||''),mode:r.mode||'',f:(r.f&&typeof r.f==='object')?r.f:{}});n++}});save();render();say(n+'개의 기록을 불러왔습니다.')}catch(x){say('파일을 읽지 못했습니다. 이 앱에서 내려받은 JSON인지 확인해 주세요.')}};
 rd.readAsText(f);
});
document.addEventListener('keydown',function(e){var n=e.target.closest&&e.target.closest('[data-node]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();mapSel=+n.dataset.node;render()}});
function chGo(c){
 var g=c.go||'debug';
 if(g==='debug')openDebug(c.issue||'','','《'+CONFIG.bookTitle+'》 '+c.label);
 else if(g==='canvas')setRoute('canvas');
 else if(g.indexOf('method:')===0){mtKind=g.slice(7);setRoute('methods')}
 else if(g.indexOf('map:')===0){mapKind=g.slice(4);mapSel=0;setRoute('map')}
}
document.addEventListener('click',function(e){
 var lk=e.target.closest('a[href^="#/"]');if(lk){e.preventDefault();setRoute(lk.getAttribute('href').slice(2));return}
 var cf=e.target.closest('[data-cf]');if(cf){var fn=pend;pend=null;$('#cf').hidden=true;if(cf.dataset.cf==='y'&&fn)fn();return}
 var el=e.target.closest('[data-d-issue],[data-d-ex],[data-d-pat],[data-d-go],[data-d-act],[data-node],[data-kind],[data-copy],[data-del],[data-resume],[data-ch],[data-bq],[data-bkissue],[data-act],[data-fl],[data-sc],[data-mt],[data-bkch]');
 if(!el)return;var d=el.dataset;
 /* 사고 디버깅 */
 if(d.dIssue!==undefined){D.issue=d.dIssue;startIssue();return}
 if(d.dEx!==undefined){var tx=$('#dThought');if(tx){tx.value=d.dEx;D.thought=d.dEx;save();dUpd();tx.focus({preventScroll:true})}return}
 if(d.dPat!==undefined){var i=+d.dPat,k=D.picked.indexOf(i);if(k>=0)D.picked.splice(k,1);else D.picked.push(i);el.setAttribute('aria-pressed',String(k<0));save();return}
 if(d.dGo!==undefined){dGo(+d.dGo);return}
 if(d.dAct){
  var a=d.dAct;
  if(a==='issueNext'){startIssue()}
  else if(a==='think'){D.pause=true;save();render();window.scrollTo({top:0})}
  else if(a==='start'){D.started=true;save();render();window.scrollTo({top:0})}
  else if(a==='back')dGo(Math.max(0,D.step-1));
  else if(a==='pauseGo'){D.pause=false;if(D.pats&&D.patsFor===D.thought&&!D.err){D.step=2;save();render();window.scrollTo({top:0})}else{D.dbg=null;D.rf=null;D.exp=null;D.step=2;doPatterns()}}
  else if(a==='define')doDefine();
  else if(a==='patterns'){D.step=2;if(D.pats&&!D.err){save();render()}else doPatterns()}
  else if(a==='debug'){D.step=3;if(D.dbg&&!D.err){save();render()}else doDebug()}
  else if(a==='reframe'){D.step=4;doReframe()}
  else if(a==='exp'){D.step=5;if(D.exp&&!D.err){save();render()}else doExperiment()}
  else if(a==='restart'){D=blankD();D.started=true;save();render();window.scrollTo({top:0})}
  else if(a==='copy'){var note=$('#copyNote');copy(dSummary(),function(m){if(note)note.textContent=m},note)}
  else if(a==='saveRec'){DB.records.push(dRecord());save();var n2=$('#copyNote');if(n2)n2.textContent='저장했습니다. ‘내 기록’ 탭에서 볼 수 있어요.'}
  return;
 }
 /* 지도 · 책 · 기록 */
 if(d.sc){var tid=d.sc;if(ROUTE!=='book')setRoute('book');var tg=document.getElementById(tid);if(tg){if(tg.tagName==='DETAILS')tg.open=true;tg.scrollIntoView({block:'start'})}return}
 if(d.mt){mtKind=d.mt;render();return}
 if(d.bkch){var ci=CHAPTERS.map(function(c){return c.id}).indexOf(d.bkch);if(ci>=0){curCh=ci;bk.w=CHAPTERS[ci].label}setRoute('book');return}
 if(d.fl!==undefined){var fl=FLOW[+d.fl];chGo({go:fl[4],label:fl[0]});return}
 if(d.node!==undefined){mapSel=+d.node;render();return}
 if(d.kind){mapKind=d.kind;mapSel=0;render();return}
 if(d.copy){var r=DB.records.filter(function(r){return r.id===d.copy})[0];if(r)copy(recText(r),say);return}
 if(d.del){ask2('이 기록을 삭제할까요? 되돌릴 수 없습니다.',function(){DB.records=DB.records.filter(function(r){return r.id!==d.del});save();render()});return}
 if(d.resume){var rr=DB.records.filter(function(r){return r.id===d.resume})[0];if(rr)openDebug(rr.issue,rr.thought,rr.source);return}
 if(d.ch!==undefined){curCh=+d.ch;bk.w=CHAPTERS[curCh].label;render();return}
 if(d.bq!==undefined){var c2=CHAPTERS[curCh],q=c2.qs[+d.bq];bk.q=q;var qt=$('#bkQuote');if(qt){qt.value=q;qt.focus()}if(c2.issue&&!bk.i){bk.i=c2.issue;var bi=$('#bkIssue');if(bi)bi.value=c2.issue;document.querySelectorAll('[data-bkissue]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.bkissue===c2.issue))})}return}
 if(d.bkissue){bk.i=d.bkissue;var bi2=$('#bkIssue');if(bi2)bi2.value=d.bkissue;document.querySelectorAll('[data-bkissue]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});return}
 var act=d.act;
 var mm=METHODS.filter(function(x){return x.k===mtKind})[0];
 if(act==='mwCopy'){copy(mwText(mm),function(m2){var e3=$('#mwMsg');if(e3)e3.textContent=m2},$('#mwMsg'))}
 else if(act==='mwSave'){dl('사고법_'+mm.name+'_'+today()+'.txt',mwText(mm),'text/plain').then(function(ok){if(!ok)showText($('#mwMsg'),mwText(mm))})}
 else if(act==='mwCanvas'){var lastv=DB.methods[mm.k+'_'+(mm.ws.length-1)],firstv=DB.methods[mm.k+'_0'];if(lastv&&!DB.canvas.e1)DB.canvas.e1=lastv;if(firstv&&mm.k!=='back'&&!DB.canvas.e0)DB.canvas.e0=firstv;save();setRoute('canvas')}
 else if(act==='mtDebug'){openDebug('','','사고법 · '+mm.name)}
 else if(act==='mapDebug'){var nd=MAP[mapKind].nodes[mapSel];openDebug('','','지도 · '+nd.n+' — 잠깐! '+nd.q)}
 else if(act==='bookGo'){var q2v=$('#bkQuote').value.trim(),iss=$('#bkIssue').value.trim(),w=$('#bkWhere').value.trim();if(!q2v){$('#bkQuote').focus();return}openDebug(iss,q2v,'《'+CONFIG.bookTitle+'》'+(w?' '+w:''));bk={q:'',w:'',i:''}}
 else if(act==='chGo'){chGo(CHAPTERS[curCh])}
 else if(act==='copyCanvas'){copy(canvasText(),function(m){var e2=$('#cvMsg');if(e2)e2.textContent=m},$('#cvMsg'))}
 else if(act==='saveCanvas'){dl('미래설계_'+today()+'.txt',canvasText(),'text/plain').then(function(ok){if(!ok)showText($('#cvMsg'),canvasText())})}
 else if(act==='exportJson'){var jt=JSON.stringify(DB.records,null,2);dl('잠깐진짜_기록_'+today()+'.json',jt,'application/json').then(function(ok){if(!ok)showText($('#notesMsg'),jt)})}
 else if(act==='exportTxt'){var tt=DB.records.map(recText).join('\n\n----------------\n\n');dl('잠깐진짜_기록_'+today()+'.txt',tt,'text/plain').then(function(ok){if(!ok)showText($('#notesMsg'),tt)})}
 else if(act==='importJson')$('#imp').click();
});
render();
})();
</script>


</body></html>
